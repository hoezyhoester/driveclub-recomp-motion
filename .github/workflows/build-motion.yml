name: Build (motion rig)

# Builds the player release - the launcher, the game runtime with the motion rig
# telemetry (docs/motion-rig.md) and every library they load - as a zip to
# download from the run's Artifacts. Nothing of the game is in it: it starts
# from the player's own dumps, as the official releases do.

on:
  workflow_dispatch:
  push:
    branches: [motion-rig]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 CLANG64 toolchain (BUILDING.md)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git zip
          pacboy: >-
            toolchain:p clang:p cmake:p ninja:p pkgconf:p vulkan-headers:p vulkan-loader:p
            vulkan-memory-allocator:p fmt:p boost:p robin-map:p xxhash:p sdl3:p zydis:p ffmpeg:p
            protobuf:p nlohmann-json:p openssl:p zlib:p miniupnpc:p python:p

      - name: Package
        run: |
          set -o pipefail
          bash packaging/package.sh "motion-rig-${GITHUB_SHA::7}" 2>&1 | tee package.log

      # The end of the logs as one annotation, so it can be read without the
      # full log (gh run view shows annotations).
      - name: Report the failure
        if: failure()
        run: |
          { echo "== package.log"; tail -60 package.log 2>/dev/null
            echo "== out/gpu-build.log"; grep -v '^\[' out/gpu-build.log 2>/dev/null | tail -60; } > failure.txt
          msg=$(sed 's/%/%25/g' failure.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: driveclub-recomp-motion-rig-win64
          path: release/*.zip
          retention-days: 30
