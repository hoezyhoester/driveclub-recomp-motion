name: Build (motion rig)

# Builds the player release - the launcher, the game runtime with the motion rig
# telemetry (docs/motion-rig.md) and every library they load - and packs it with
# SpaceMonkey and a guide (packaging/motion/LEESMIJ.txt), as one zip to download
# from the run's Artifacts. Nothing of the game is in it: it starts
# from the player's own dumps, as the official releases do.

on:
  workflow_dispatch:
  push:
    branches: [motion-rig]

permissions:
  contents: write   # a failed build pushes its logs to the ci-logs branch

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: MSYS2 CLANG64 toolchain (BUILDING.md)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          release: false   # the runner's own C:\msys64, which build.sh and package.sh put first on PATH
          update: true
          install: base-devel git zip grep sed gawk coreutils findutils
          pacboy: >-
            toolchain:p clang:p cmake:p ninja:p pkgconf:p vulkan-headers:p vulkan-loader:p
            vulkan-memory-allocator:p fmt:p boost:p robin-map:p xxhash:p sdl3:p zydis:p ffmpeg:p
            protobuf:p nlohmann-json:p openssl:p zlib:p miniupnpc:p python:p

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report() {   # the end of a log as one annotation (bash only), readable without the full log
            local file=$1 lines=() msg="" i
            [ -f "$file" ] || return 0
            mapfile -t lines < "$file"
            for ((i=${#lines[@]}>40 ? ${#lines[@]}-40 : 0; i<${#lines[@]}; ++i)); do
              local line=${lines[i]//$'\r'/}
              line=${line//%/%25}
              msg+="${line:0:300}%0A"
            done
            echo "::error title=${file//\//_}::${msg}"
            echo "== $file"; for ((i=${#lines[@]}>40 ? ${#lines[@]}-40 : 0; i<${#lines[@]}; ++i)); do echo "${lines[i]}"; done
          }
          # The version is past the official 0.3.2 so the launcher's updater does not replace this build with it.
          { echo "PATH=$PATH"; echo "MSYSTEM=$MSYSTEM"; command -v bash clang cmake ninja pkg-config python windres ldd strip zip; pwd; ls; } > package.log 2>&1
          if ! bash -x packaging/package.sh "0.3.2.1-motion-${GITHUB_SHA::7}" >> package.log 2>&1; then
            report package.log
            report out/gpu-build.log
            # the logs on the ci-logs branch, to read without the Actions website
            mkdir -p ../ci-logs && cp package.log ../ci-logs/ && { cp out/gpu-build.log ../ci-logs/ 2>/dev/null || true; }
            cd ../ci-logs && git init -q && git checkout -q -b ci-logs && git add -A &&
              git -c user.name=ci -c user.email=ci@localhost commit -qm "logs of ${GITHUB_SHA::7}" &&
              git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs || true
            exit 1
          fi
          tail -n 20 package.log

      # The complete motion pack: this build, SpaceMonkey with its DriveClub button (built from
      # hoezyhoester/hoezy2, branch burnout-revenge, dist/) and the Dutch guide, in one zip.
      - name: Motion pack
        run: |
          git clone -q --depth 1 -b burnout-revenge https://github.com/hoezyhoester/hoezy2 ../spacemonkey
          python - "$(ls release/*.zip | head -1)" ../spacemonkey/dist/SpaceMonkey-BurnoutRevenge-DriveClub.zip \
              packaging/motion/LEESMIJ.txt "pack/DriveClub-Motion-Pakket-${GITHUB_SHA::7}.zip" <<'PYEOF'
          import os, sys, zipfile
          game, monkey, guide, dest = sys.argv[1:5]
          top = "DriveClub-Motion"
          os.makedirs(os.path.dirname(dest), exist_ok=True)
          def copy(src, under, out):
              with zipfile.ZipFile(src) as z:
                  for info in z.infolist():
                      parts = info.filename.split("/", 1)
                      if len(parts) < 2 or not parts[1] or info.is_dir():
                          continue
                      out.writestr(top + "/" + under + "/" + parts[1], z.read(info), zipfile.ZIP_DEFLATED)
          with zipfile.ZipFile(dest, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as out:
              copy(game, "DriveClub", out)
              copy(monkey, "SpaceMonkey", out)
              out.write(guide, top + "/LEESMIJ.txt")
          print("wrote", dest, os.path.getsize(dest))
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: DriveClub-Motion-Pakket
          path: pack/*.zip
          retention-days: 90
